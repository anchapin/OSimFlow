version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: osimflow-postgres
    environment:
      POSTGRES_DB: osimflow
      POSTGRES_USER: osimflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osimflow-dev}
    ports:
      "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osimflow -d osimflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - osimflow-net

  redis:
    image: redis:7-alpine
    container_name: osimflow-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - osimflow-net

  mlflow:
    image: ghcr.io/anchapin/mlflow:latest
    container_name: osimflow-mlflow
    environment:
      MLFLOW_TRACKING_URI: postgresql://osimflow:${POSTGRES_PASSWORD:-osimflow-dev}@postgres:5432/osimflow
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - osimflow-net

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: osimflow-opensearch
    environment:
      OPENSEARCH_JAVA_OPTS: -Xmx512m -Xms256m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-admin}
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_SETUP_SAMPLE_DATA: "false"
    ports:
      "${OPENSEARCH_PORT:-9200}:9200"
      "${OPENSEARCH_DASHBOARD_PORT:-5601}:5601"
    volumes:
      - opensearch_data:/var/lib/opensearch
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - osimflow-net

  localstack:
    image: localstack/localstack:3.5
    container_name: osimflow-localstack
    environment:
      DEBUG: "${LOCALSTACK_DEBUG:-1}"
      SERVICES: ${LOCALSTACK_SERVICES:-batch,secretsmanager,cloudwatch,logs}
      EDGE_PORT: "${LOCALSTACK_EDGE_PORT:-4566}"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCALSTACK_HOST: localhost
    ports:
      "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health | grep -q '\"running\":true'"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - osimflow-net

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  opensearch_data:
  localstack_data:

networks:
  osimflow-net:
    driver: bridge
