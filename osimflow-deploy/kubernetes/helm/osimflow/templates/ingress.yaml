# Ingress for the REST API server (optional).
# Only created when ingress.enabled=true.

{{- if and .Values.ingress.enabled .Values.api.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "osimflow.api.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "osimflow.name" . }}
    app.kubernetes.io/component: api
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.class_name }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "osimflow.api.name" . }}
                port:
                  name: http
{{- end }}
