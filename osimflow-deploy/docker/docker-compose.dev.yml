# Docker Compose — Local Development Environment
version: "3.9"

# OSimFlow local development stack.
# Use this for local development and testing without cloud credentials.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up
#   docker compose -f docker-compose.dev.yml down -v  # clean up volumes

services:
  # PostgreSQL — campaign registry and MLflow backend store
  postgres:
    image: postgres:16-alpine
    container_name: osimflow-postgres-dev
    environment:
      POSTGRES_DB: osimflow
      POSTGRES_USER: osimflow
      POSTGRES_PASSWORD: osimflow-dev
    ports:
      "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osimflow -d osimflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - osimflow-dev-net

  # Redis — job queue backend (issue #263)
  redis:
    image: redis:7-alpine
    container_name: osimflow-redis-dev
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - osimflow-dev-net

  # MLflow — experiment tracking (optional, issue #7)
  mlflow:
    image: ghcr.io/anchapin/mlflow:latest
    container_name: osimflow-mlflow-dev
    environment:
      MLFLOW_TRACKING_URI: postgresql://osimflow:osimflow-dev@postgres:5432/osimflow
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - osimflow-dev-net

  # LocalStack — AWS service emulator (batch, s3, cloudwatch, logs)
  localstack:
    image: localstack/localstack:3.5
    container_name: osimflow-localstack-dev
    environment:
      DEBUG: "1"
      SERVICES: batch,secretsmanager,cloudwatch,logs,s3
      EDGE_PORT: "${LOCALSTACK_EDGE_PORT:-4566}"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCALSTACK_HOST: localhost
    ports:
      "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health | grep -q '\"running\":true'"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - osimflow-dev-net

  # OSimFlow CLI — interactive dev shell
  osimflow-dev:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.dev
    container_name: osimflow-dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: osimflow
      POSTGRES_USER: osimflow
      POSTGRES_PASSWORD: osimflow-dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      LOCALSTACK_HOST: localstack
      LOCALSTACK_PORT: 4566
    volumes:
      - ../../osimflow:/app/osimflow
      - ../../bin:/app/bin
      - ../../tests:/app/tests
      - ../../docs:/app/docs
      - ../../user_scripts:/app/user_scripts
      - ../../example_package:/app/example_package
      - ../../variables.yml:/app/variables.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
      localstack:
        condition: service_healthy
    networks:
      - osimflow-dev-net
    command: sleep infinity

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  localstack_data:

networks:
  osimflow-dev-net:
    driver: bridge
