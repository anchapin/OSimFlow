# =============================================================================
# .github/workflows/ci.yml — split CI: lint + typecheck + test (parallel)
# =============================================================================
# Runs the local `make test-cov` + `make contract` + `make typecheck`
# (pytest flags are single-sourced in the Makefile; issue #1476).
# Triggered on push to main and on PRs.
#
# This workflow was split from a single monolithic job (issue #76) into
# parallel jobs gated by `needs:` so the merge signal waits for all of:
#   - lint       : ruff check + ruff format --check  (parallel; ~30s)
#   - typecheck  : mypy --strict on osimflow/         (parallel; ~60s)
#   - test       : pytest with 82% coverage gate      (depends on lint+typecheck; issue #1417)
#   - contract   : AGENTS.md / docs drift gate + the bounded tests/contract
#                  pytest suite (issue #1629 — the make test-fast /
#                  pre-commit pytest-fast mirror; parallel; ~2 min)
#   - security   : pip-audit dependency vulnerability check (parallel; ~30s)
#
# Install uses `uv sync --locked` (honours uv.lock; ~10x faster than pip);
# setup-uv caches uv's download cache keyed on uv.lock (issue #1854), and each
# job builds a fresh .venv with exactly the extras it needs. The uv version is
# pinned via setup-uv's `version:` input — keep the pin IDENTICAL in every
# workflow that uses setup-uv (ci.yml, bench.yml, release.yml,
# release-installers.yml, nomad-e2e.yml); issue #1477. Toolchain split:
# CI installs with uv, local development uses pip via `make install`
# (see docs/DEVELOPMENT.md §4) — CI is the authority for the merged
# dependency set.
#
# Local pre-commit is the day-to-day mirror; CI is the merge gate.
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        run: uv python install 3.12

      - name: ruff check
        # uvx runs the tool in an isolated venv, so the system
        # Python's PEP 668 "externally managed" marker is not an issue.
        run: uvx "ruff>=0.6" check .

      - name: ruff format --check
        run: uvx "ruff>=0.6" format --check .

  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for non-docs changes
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            docs/**
            "**/*.md"
            LICENSE
            .agents/**

      - name: Skip if docs-only
        if: steps.changed.outputs.any_changed != 'true'
        run: |
          echo "No non-docs files changed — typecheck not required"
          echo "::notice::Docs-only PR: typecheck skipped (no Python code changed)"
          exit 0

      - name: Install uv
        if: steps.changed.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        if: steps.changed.outputs.any_changed == 'true'
        run: uv python install 3.12

      - name: Install (editable + dev extras)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          # azure extra included so mypy --strict resolves azure.batch and
          # actually type-checks osimflow/executors/azure_batch_executor.py
          # (issue #1582).
          uv sync --locked --python 3.12 --extra dev --extra aws --extra azure --extra slurm --extra kubernetes

      - name: mypy osimflow/
        if: steps.changed.outputs.any_changed == 'true'
        run: .venv/bin/mypy osimflow

  contract:
    name: agents & docs contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        run: uv python install 3.12

      - name: Install (editable + dev + api extras)
        # `api` extra (issue #1629): tests/contract's openapi-sync and
        # API-contract tests import osimflow.api / fastapi; without the
        # extra they importorskip and the gate silently loses coverage.
        run: |
          uv sync --locked --python 3.12 --extra dev --extra aws --extra slurm --extra kubernetes --extra api

      - name: AGENTS.md / code drift
        run: .venv/bin/python tools/check_agents_contract.py

      - name: docs/ path resolution
        run: .venv/bin/python tools/check_docs_sync.py

      - name: pytest (tests/contract, fast subset)
        # Issue #1629: the SAME invocation the pre-commit `pytest-fast`
        # hook and `make test-fast` use — byte-identical flags,
        # single-sourced in .pre-commit-config.yaml and the Makefile.
        # Do not inline different flags here.
        run: .venv/bin/pytest -o addopts="" tests/contract -x -q -m "not slow and not chaos and not full"

  security:
    name: security (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for non-docs changes
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            docs/**
            "**/*.md"
            LICENSE
            .agents/**

      - name: Skip if docs-only
        if: steps.changed.outputs.any_changed != 'true'
        run: |
          echo "No non-docs files changed — security audit not required"
          echo "::notice::Docs-only PR: pip-audit skipped (no Python dependencies changed)"
          exit 0

      - name: Install uv
        if: steps.changed.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        if: steps.changed.outputs.any_changed == 'true'
        # Same uv-managed interpreter as every other job. The historical
        # workaround (actions/setup-python because uv-managed Pythons
        # lacked `ensurepip`, so pip-audit's dependency-resolution
        # sub-venv exited 127) is no longer needed: python-build-standalone
        # builds distributed by current uv ship `ensurepip` (verified by
        # running `pip-audit -r ... --strict` green against a
        # `uv venv --python 3.12` environment; issue #1477).
        run: uv python install 3.12

      - name: Install (editable + dev extras)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          uv sync --locked --python 3.12 --extra dev --extra aws --extra slurm --extra kubernetes

      - name: Install pip-audit
        if: steps.changed.outputs.any_changed == 'true'
        run: uv pip install --python .venv/bin/python "pip-audit>=2.7"

      - name: Audit dependencies
        if: steps.changed.outputs.any_changed == 'true'
        # pip-audit scans the *installed* package set and looks each one
        # up against the OSV / PyPA advisory database. We freeze the
        # venv (excluding the local `osimflow` editable install, which
        # has no PyPI metadata to audit) and audit that requirement
        # set. `--strict` exits non-zero on any confirmed vulnerability,
        # failing the job. If a transitive dep gets flagged, fix it
        # by bumping the bound in pyproject.toml.
        run: |
          uv pip freeze --python .venv/bin/python > /tmp/requirements.txt
          # Filter out the local `osimflow` editable entry. grep exit code 1
          # means "no matches" (legitimate — all deps are osimflow), which is
          # fine. Any other exit code is a real error. The redirect creates
          # the file only if grep succeeds.
          grep -vE '^(osimflow==|-e .*(#egg=osimflow|/OSimFlow)(\s|$))' \
            /tmp/requirements.txt > /tmp/requirements-filtered.txt \
            || rc=$?; if [ "${rc:-0}" -ne 1 ] && [ "${rc:-0}" -ne 0 ]; then exit "$rc"; fi
          # Defensive: refuse to audit an empty dependency set.
          if [ ! -s /tmp/requirements-filtered.txt ]; then
            echo "::error title=Empty requirements::pip freeze produced no auditable dependencies — refusing to run pip-audit on an empty file"
            exit 1
          fi
          echo "::group::Audited dependency set:"
          cat /tmp/requirements-filtered.txt
          echo "::endgroup::"
          .venv/bin/pip-audit -r /tmp/requirements-filtered.txt --strict
          echo "::notice::pip-audit found no known vulnerabilities."

  test:
    name: test (pytest, 82% coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for non-docs changes
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            docs/**
            "**/*.md"
            LICENSE
            .agents/**

      - name: Skip if docs-only
        if: steps.changed.outputs.any_changed != 'true'
        run: |
          echo "No non-docs files changed — test not required"
          echo "::notice::Docs-only PR: pytest skipped (no Python code changed)"
          exit 0

      - name: Install uv
        if: steps.changed.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        if: steps.changed.outputs.any_changed == 'true'
        run: uv python install 3.12

      - name: Install (editable + all extras + pytest-xdist)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          uv sync --locked --python 3.12 --extra dev --extra aws --extra azure --extra slurm --extra kubernetes --extra api --extra sensitivity --extra optimization --extra ga

      - name: pytest with coverage gate
        if: steps.changed.outputs.any_changed == 'true'
        # Flags live in the Makefile (PYTEST_CI_FLAGS / PYTEST_COV_FLAGS,
        # issue #1476) — the single source of truth shared with the local
        # `make test` / `make test-cov` targets. Do not inline them here.
        run: |
          start=$(date +%s)
          make test-cov PYTEST_WORKERS=auto 2>&1 | tee pytest-output.log
          echo "$(( $(date +%s) - start ))" > pytest-wall-seconds.txt

      - name: Per-step timing summary (issue #1855)
        if: steps.changed.outputs.any_changed == 'true' && always()
        run: |
          {
            echo "### Test job timing"
            if [ -f pytest-wall-seconds.txt ]; then
              echo "- pytest + coverage wall time: $(cat pytest-wall-seconds.txt)s"
            fi
            echo
            echo "#### Slowest 20 tests (pytest --durations=20)"
            echo '```'
            if [ -f pytest-output.log ]; then
              sed -n '/slowest .* durations/,/^$/p' pytest-output.log | head -30
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: steps.changed.outputs.any_changed == 'true' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Real MLflow file-tracking smoke test (issue #948)
  # ---------------------------------------------------------------------------
  # Exercises ``osimflow/mlflow_hook`` against the *real* ``mlflow`` package
  # (not the ``sys.modules`` fake the unit tests inject). The test uses a
  # hermetic ``file://`` tracking store (no server, no network) plus stub
  # simulation, so it is a *genuinely-passing* smoke test rather than inert
  # scaffolding. It catches mlflow API regressions (e.g. the mlflow 3.x
  # file-store deprecation / missing-Default-experiment errors) that the
  # mock-based unit tests cannot see.
  #
  # This job is additive and non-blocking for the main test gate: it installs
  # the optional ``[mlflow]`` extra, sets ``OSIMFLOW_MLFLOW_E2E=1``, and runs
  # only the gated smoke test. The main ``test`` job does not install mlflow,
  # so the coverage gate is unaffected.
  # ---------------------------------------------------------------------------
  mlflow-real:
    name: mlflow-real (file tracking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for non-docs changes
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            docs/**
            "**/*.md"
            LICENSE
            .agents/**

      - name: Skip if docs-only
        if: steps.changed.outputs.any_changed != 'true'
        run: |
          echo "No non-docs files changed — mlflow test not required"
          echo "::notice::Docs-only PR: mlflow-real skipped (no Python code changed)"
          exit 0

      - name: Install uv
        if: steps.changed.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        if: steps.changed.outputs.any_changed == 'true'
        run: uv python install 3.12

      - name: Install (editable + dev + mlflow extras)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          uv sync --locked --python 3.12 --extra dev --extra mlflow

      - name: pytest (real MLflow file-tracking smoke test)
        if: steps.changed.outputs.any_changed == 'true'
        env:
          OSIMFLOW_MLFLOW_E2E: "1"
        run: .venv/bin/pytest tests/integration/test_mlflow_real_tracking.py -v --timeout=300 --no-cov

  # ---------------------------------------------------------------------------
  # G16a: AWS Batch mocked integration tests (issue #149)
  # ---------------------------------------------------------------------------
  # Runs moto-based tests that exercise the real boto3 wire format against
  # a local mock AWS server — no AWS credentials needed.  Parallel with
  # the main test job; moto is pulled in via the [dev] extras group.
  # ---------------------------------------------------------------------------
  aws-batch-mock:
    name: aws-batch-mock (moto)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for non-docs changes
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            docs/**
            "**/*.md"
            LICENSE
            .agents/**

      - name: Skip if docs-only
        if: steps.changed.outputs.any_changed != 'true'
        run: |
          echo "No non-docs files changed — AWS Batch mocked tests not required"
          echo "::notice::Docs-only PR: aws-batch-mock skipped (no Python code changed)"
          exit 0

      - name: Install uv
        if: steps.changed.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        if: steps.changed.outputs.any_changed == 'true'
        run: uv python install 3.12

      - name: Install (editable + dev + aws extras)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          uv sync --locked --python 3.12 --extra dev --extra aws --extra slurm --extra kubernetes

      - name: pytest (AWS Batch mocked tests)
        if: steps.changed.outputs.any_changed == 'true'
        run: .venv/bin/pytest tests/integration/test_aws_batch_mocked.py -v --no-cov

  # ---------------------------------------------------------------------------
  # Nomad single-node E2E test (issue #133)
  # ---------------------------------------------------------------------------
  # Starts a Docker-in-Docker Nomad dev agent via Docker Compose and runs
  # the 3-sample campaign smoke test against it. Fast enough (< 2 min)
  # to run on every PR rather than nightly.
  # ---------------------------------------------------------------------------
  nomad-single-node:
    name: nomad e2e (single-node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for non-docs changes
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            docs/**
            "**/*.md"
            LICENSE
            .agents/**

      - name: Skip if docs-only
        if: steps.changed.outputs.any_changed != 'true'
        run: |
          echo "No non-docs files changed — Nomad tests not required"
          echo "::notice::Docs-only PR: Nomad tests skipped (no Python code changed)"
          exit 0

      - name: Install uv
        if: steps.changed.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        if: steps.changed.outputs.any_changed == 'true'
        run: uv python install 3.12

      - name: Install (editable + dev extras)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          uv sync --locked --python 3.12 --extra dev --extra aws --extra slurm --extra kubernetes

      # -------------------------------------------------------------------
      # Docker diagnostics (issue #195)
      # -------------------------------------------------------------------
      # Prints Docker availability, compose version, and privileged-mode
      # info so that skip/xfail reasons can be diagnosed from CI logs.
      # -------------------------------------------------------------------
      - name: Docker diagnostics
        if: steps.changed.outputs.any_changed == 'true'
        id: docker_check
        run: |
          echo "::group::Docker availability"
          if docker info > /dev/null 2>&1; then
            echo "docker_info=available" >> "$GITHUB_OUTPUT"
            echo "Docker: available"
            docker info --format '{{.ServerVersion}}'
          else
            echo "docker_info=unavailable" >> "$GITHUB_OUTPUT"
            echo "Docker: NOT available"
          fi
          echo "::endgroup::"

          echo "::group::Docker Compose version"
          if docker compose version > /dev/null 2>&1; then
            echo "compose_info=available" >> "$GITHUB_OUTPUT"
            echo "Docker Compose: available"
            docker compose version
          else
            echo "compose_info=unavailable" >> "$GITHUB_OUTPUT"
            echo "Docker Compose: NOT available"
          fi
          echo "::endgroup::"

          echo "::group::Privileged mode check"
          if docker run --rm --privileged hello-world > /dev/null 2>&1; then
            echo "privileged=available" >> "$GITHUB_OUTPUT"
            echo "Privileged mode: available"
          else
            echo "privileged=unavailable" >> "$GITHUB_OUTPUT"
            echo "Privileged mode: NOT available"
          fi
          echo "::endgroup::"

      # -------------------------------------------------------------------
      # Mock-based Nomad tests (always run, no Docker needed)
      # -------------------------------------------------------------------
      - name: Run mock-based Nomad tests
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          .venv/bin/pytest \
            tests/integration/nomad_e2e/test_single_node_mock.py \
            -v --no-cov -ra

      # -------------------------------------------------------------------
      # Docker-based E2E tests (require Docker)
      # If Docker is unavailable, FAIL instead of silently skipping.
      # -------------------------------------------------------------------
      - name: Run Docker-based Nomad E2E tests
        if: steps.changed.outputs.any_changed == 'true' && steps.docker_check.outputs.docker_info == 'available'
        run: |
          .venv/bin/pytest \
            tests/integration/nomad_e2e/test_single_node.py \
            -v -m nomad_e2e --no-cov -ra

      - name: Fail if Docker unavailable for E2E tests
        if: steps.changed.outputs.any_changed == 'true' && steps.docker_check.outputs.docker_info != 'available'
        run: |
          echo "::error title=Docker unavailable::Docker is not available on this runner — Nomad E2E tests cannot run. This is a hard failure, not a silent skip (issue #195)."
          exit 1

  # ---------------------------------------------------------------------------
  # G18a: Terraform validate (issue #148)
  # ---------------------------------------------------------------------------
  # Runs terraform init + validate when files under infra/ change.
  # No AWS credentials needed — uses -backend=false (local-only validation).
  # ---------------------------------------------------------------------------
  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for infra/ changes
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            infra/**

      - name: Setup Terraform
        if: steps.changed.outputs.any_changed == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: terraform init
        if: steps.changed.outputs.any_changed == 'true'
        run: terraform -chdir=infra/aws/terraform init -backend=false

      - name: terraform validate
        if: steps.changed.outputs.any_changed == 'true'
        run: terraform -chdir=infra/aws/terraform validate
