# =============================================================================
# .github/workflows/ci.yml — full CI: lint + typecheck + test + coverage gate
# =============================================================================
# Mirrors the local `make test-cov` + `make contract` + `make typecheck`.
# Triggered on push to main and on PRs.
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,aws,slurm]"

      - name: ruff (lint)
        run: python -m ruff check .

      - name: ruff format (check)
        run: python -m ruff format --check .

      - name: mypy (osimflow/)
        run: python -m mypy osimflow

      - name: pytest with coverage gate
        run: |
          python -m pytest --cov=osimflow --cov-report=xml --cov-report=term --cov-fail-under=85 -q

      - name: AGENTS.md contract check
        run: python tools/check_agents_contract.py

      - name: docs/ sync check
        run: python tools/check_docs_sync.py

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
