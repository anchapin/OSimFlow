# =============================================================================
# .github/workflows/aws-emulator.yml — AWSBatchExecutor + S3 detach vs AWS Emulator
# =============================================================================
# Runs tests/integration/test_aws_batch_emulator.py against AWS Emulator
# (https://github.com/aws/aws-emulator): local AWS APIs, no account, no
# credentials, no OIDC. Sits between the mocked-boto3 suites and the nightly
# real-AWS aws-batch-e2e.yml, which stays the reference for job execution and
# IAM. The emulator version is pinned and checksum-verified; bump both values
# together after checking the release's scores.json for Batch and S3.
# =============================================================================
name: AWS Emulator

on:
  pull_request:
    paths:
      - "osimflow/executors/aws_batch_executor.py"
      - "osimflow/s3_campaign.py"
      - "osimflow/storage/**"
      - "tests/integration/test_aws_batch_emulator.py"
      - ".github/workflows/aws-emulator.yml"
  push:
    branches: [main]
    paths:
      - "osimflow/executors/aws_batch_executor.py"
      - "osimflow/s3_campaign.py"
      - "osimflow/storage/**"
      - "tests/integration/test_aws_batch_emulator.py"
      - ".github/workflows/aws-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_EMULATOR_VERSION: 1.0.611
  AWS_EMULATOR_DEB_SHA256: c64018e81ed049e87ff393f90f8878c64e32d43710968686fce78f77111ea8c0
  EMULATOR_TELEMETRY: "off"

jobs:
  aws-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install OSimFlow
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,aws]"

      - name: Install AWS Emulator (pinned, checksum-verified)
        run: |
          curl -fsSLo aws-emulator.deb \
            "https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/aws-emulator_${AWS_EMULATOR_VERSION}-1_amd64.deb"
          echo "${AWS_EMULATOR_DEB_SHA256}  aws-emulator.deb" | sha256sum -c -
          sudo apt-get install -y ./aws-emulator.deb
          aws-emulator -v

      - name: Start AWS Emulator
        run: |
          aws-emulator --telemetry off > "$RUNNER_TEMP/aws-emulator.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf --cacert ~/.aws/emulator/9297/ca.pem https://127.0.0.1:9297/__admin/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/aws-emulator.log"; exit 1

      - name: Point the AWS SDK at the emulator only
        run: |
          {
            echo "AWS_ENDPOINT_URL=https://127.0.0.1:9297"
            echo "AWS_SHARED_CREDENTIALS_FILE=$HOME/.aws/emulator/9297/emulator_credentials"
            echo "AWS_CONFIG_FILE=$HOME/.aws/emulator/9297/config"
            echo "AWS_CA_BUNDLE=$HOME/.aws/emulator/9297/ca.pem"
            echo "AWS_EC2_METADATA_DISABLED=true"
            echo "AWS_DISABLE_HOST_PREFIX_INJECTION=true"
            echo "AWS_REGION=us-east-1"
            echo "AWS_DEFAULT_REGION=us-east-1"
          } >> "$GITHUB_ENV"

      - name: Guard - emulator account only
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          test "$account" = "000000000000" || { echo "Refusing to run: account is $account"; exit 1; }

      - name: Run emulator tests
        env:
          OSIMFLOW_AWS_EMULATOR: "1"
        run: .venv/bin/pytest tests/integration/test_aws_batch_emulator.py -v -ra --no-cov

      - name: Emulator log
        if: failure()
        run: cat "$RUNNER_TEMP/aws-emulator.log"
