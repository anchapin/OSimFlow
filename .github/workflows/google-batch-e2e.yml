# =============================================================================
# .github/workflows/google-batch-e2e.yml — Real Google Cloud Batch E2E (nightly)
# =============================================================================
# Runs a 3-sample campaign against a real Google Cloud Batch environment
# every night at 06:00 UTC and on manual trigger (workflow_dispatch).
#
# Prerequisites (GitHub secrets / variables):
#   secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER — WIF provider id (full resource
#       name, e.g. projects/<N>/locations/global/workloadIdentityPools/<pool>/providers/<prov>)
#   secrets.GOOGLE_SERVICE_ACCOUNT            — GCP service account email with
#       Cloud Batch submit/get permissions
#   vars.OSIMFLOW_GOOGLE_BATCH_PROJECT_ID      — GCP project id
#   vars.OSIMFLOW_GOOGLE_BATCH_REGION          — Google Cloud region (e.g. us-central1)
#   vars.OSIMFLOW_GOOGLE_BATCH_SERVICE_ACCOUNT — Batch service account email
#       attached to the submitted jobs (may equal GOOGLE_SERVICE_ACCOUNT)
#
# Uses Workload Identity Federation (google-github-actions/auth@v2) — no
# long-lived service account keys. The test file uses pytest.mark.skipif
# so it is inert in normal CI.
# =============================================================================
name: Google Batch E2E (Nightly)

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6am UTC
  workflow_dispatch: # Manual trigger

permissions:
  id-token: write
  contents: read

jobs:
  google-batch-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OSimFlow with dev extra + google-cloud-batch
        run: |
          pip install -e ".[dev]"
          pip install google-cloud-batch

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Run real Google Cloud Batch E2E
        env:
          OSIMFLOW_GOOGLE_BATCH_E2E: 1
          OSIMFLOW_GOOGLE_BATCH_PROJECT_ID: ${{ vars.OSIMFLOW_GOOGLE_BATCH_PROJECT_ID }}
          OSIMFLOW_GOOGLE_BATCH_REGION: ${{ vars.OSIMFLOW_GOOGLE_BATCH_REGION }}
          OSIMFLOW_GOOGLE_BATCH_SERVICE_ACCOUNT: ${{ vars.OSIMFLOW_GOOGLE_BATCH_SERVICE_ACCOUNT }}
        run: .venv/bin/pytest tests/integration/test_google_batch_real.py -v --timeout=1800
