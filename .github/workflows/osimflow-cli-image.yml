# ===========================================================================
# OSimFlow CLI — Docker image CI/CD
#
# Builds and pushes a multi-arch Docker image to Docker Hub whenever a
# version tag (osimflow-v*) is pushed. Also supports manual workflow_dispatch.
#
# Image: docker.io/anchapin/osimflow
# Tags : <version>  +  latest (on default branch)
# ===========================================================================
name: Build & push OSimFlow CLI image

on:
  push:
    tags:
      - "osimflow-v*"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the image to Docker Hub (unset to build-only)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  IMAGE_NAME: docker.io/anchapin/osimflow

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ---- Checkout --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # ---- Extract version from tag ----------------------------------------
      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/osimflow-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/osimflow-v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA:0:7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ---- Docker buildx setup ---------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---- QEMU for multi-arch builds --------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ---- Docker Hub login ------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Build metadata --------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      # ---- Build & push ----------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/osimflow-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
