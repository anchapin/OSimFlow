# =============================================================================
# .github/workflows/release.yml — PyPI publish on GitHub Release (issue #76)
# =============================================================================
# Flow:
#   1. Tag push of `v*` (e.g. `v0.1.0` or `v0.1.0-rc.1`) triggers the job.
#   2. The package version is read from the tag and validated against
#      `pyproject.toml` (must match `project.version`).
#   3. sdist + wheel are built with `python -m build`.
#   4. A CycloneDX 1.5 SBOM (`dist/osimflow-<ver>.cdx.json`) is generated
#      with `cyclonedx-py environment` from the freshly installed wheel
#      (issue #954).
#   5. The build artifacts (incl. the SBOM) are signed with Sigstore
#      keyless signing via `sigstore/gh-action-sigstore-python`.
#   6. Release candidates (tag suffix `-rc.*`) are published to TestPyPI.
#   7. Stable releases (no `-rc` suffix) are published to PyPI.
#   8. A GitHub Release is generated with the changelog derived from the
#      previous tag and attaches the SBOM as a release asset.
#
# Required repository secrets:
#   - none for Sigstore (uses OIDC keyless signing against the public
#     Sigstore transparency log).
#
# Required PyPI publishing is delegated to PyPI's "Trusted Publishing"
# flow (no API token needed): the project must be registered on PyPI
# with this repository as the trusted publisher.
# =============================================================================
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # so we can create a GitHub Release
  id-token: write   # Sigstore keyless OIDC + PyPI Trusted Publishing

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # for changelog generation

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install build + twine
        run: uv pip install --system "build>=1.2" "twine>=5"

      - name: Verify tag matches pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PYPROJECT_VERSION="$(python -c 'import tomllib, sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          EXPECTED_TAG="v${PYPROJECT_VERSION}"
          # Allow RC tags to differ from pyproject (RCs don't bump project.version).
          if [[ "${TAG}" != "${EXPECTED_TAG}" && "${TAG}" != "${EXPECTED_TAG}-rc."* ]]; then
            echo "::error title=Tag/version mismatch::tag ${TAG} does not match project.version ${PYPROJECT_VERSION} (or ${PYPROJECT_VERSION}-rc.N)."
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m build --sdist --wheel

      - name: Generate CycloneDX SBOM
        # Issue #954: emit a CycloneDX 1.5 SBOM for the freshly built wheel
        # so downstream consumers can audit the transitive dependency
        # surface. The SBOM is generated BEFORE Sigstore signing so it is
        # itself signed, and lands in `dist/` so the upload-artifact and
        # GitHub Release steps pick it up automatically.
        run: |
          set -euo pipefail
          uv pip install --system cyclonedx-bom
          # Install the wheel just produced so cyclonedx-py can resolve
          # the package metadata and its runtime dependencies.
          uv pip install --system dist/osimflow-*.whl
          VERSION="$(python -c 'import importlib.metadata; print(importlib.metadata.version("osimflow"))')"
          cyclonedx-py environment \
            --schema-version 1.5 \
            --output-format json \
            --output-file "dist/osimflow-${VERSION}.cdx.json"
          echo "Generated SBOM: dist/osimflow-${VERSION}.cdx.json"

      - name: Sign with Sigstore
        # Keyless signing against the public Sigstore transparency log.
        # Stores the signature as a separate .sigstore bundle next to
        # each artifact so downstream consumers can verify authenticity.
        # Signs the sdist, wheel, and CycloneDX SBOM (issue #954).
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: >-
            ./dist/*.whl
            ./dist/*.tar.gz
            ./dist/*.cdx.json
          output-directory: ./dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI (rc tags)
    if: startsWith(github.ref_name, 'v') && contains(github.ref_name, '-rc.')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: testpypi
      url: https://test.pypi.org/p/osimflow
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    name: publish to PyPI (stable tags)
    if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc.')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/osimflow
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: create GitHub Release
    if: always()
    needs: [publish-testpypi, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        if: |
          (needs.publish-testpypi.result == 'success') ||
          (needs.publish-pypi.result == 'success')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore
            dist/*.cdx.json
