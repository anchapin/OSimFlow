# =============================================================================
# .github/workflows/openstudio-cli-e2e.yml — Real OpenStudio CLI E2E (nightly)
# =============================================================================
# Runs a minimal real OpenStudio simulation campaign against the
# nrel/openstudio:<version> container every night at 06:00 UTC and on
# manual trigger (workflow_dispatch).
#
# This workflow exercises the production code path that was previously
# stub-only: openstudio.cli run -w workflow.osw inside the container,
# eplusout.sql validation, and the --openstudio_version flag across
# multiple version tags (issue #246).
#
# Jobs:
#   * openstudio-cli-e2e  — existing UNIT test of run_openstudio_sim in
#                            isolation (issue #246).
#   * full-campaign-e2e  — NEW (issue #939): full Campaign.run() over all 7
#                            DAG steps with a real openstudio.cli, driven by
#                            tests/integration/test_real_openstudio_campaign.py.
#                            The OpenStudio CLI is installed on the host runner
#                            from the NREL GitHub release .deb so the test
#                            runs under the same Python 3.12 venv used by CI
#                            (the nrel/openstudio container ships a different
#                            Python that is incompatible with osimflow's 3.12+
#                            requirement). The fetched real .osm/.epw fixture
#                            (scripts/fetch_example_fixture.py) drives the run.
#
# Prerequisites:
#   vars.OPENSTUDIO_VERSION — OpenStudio version to test (e.g. 3.11.0)
#
# Uses the nrel/openstudio container from Docker Hub. No credentials needed.
# =============================================================================
name: openstudio-cli-e2e (Nightly)

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6am UTC
  workflow_dispatch:
    inputs:
      openstudio_version:
        description: 'OpenStudio version (e.g. 3.11.0)'
        required: false
        default: '3.11.0'
      n_samples:
        description: 'Number of samples to run'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  openstudio-cli-e2e:
    name: openstudio-cli-e2e (${{ inputs.openstudio_version || vars.OPENSTUDIO_VERSION || '3.11.0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set inputs
        id: inputs
        run: |
          VERSION="${{ inputs.openstudio_version || vars.OPENSTUDIO_VERSION || '3.11.0' }}"
          SAMPLES="${{ inputs.n_samples || '1' }}"
          echo "openstudio_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "n_samples=${SAMPLES}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OSimFlow with dev extras
        run: pip install -e ".[dev]"

      - name: Pull OpenStudio container
        run: |
          docker pull nrel/openstudio:${{ steps.inputs.outputs.openstudio_version }}
          docker tag nrel/openstudio:${{ steps.inputs.outputs.openstudio_version }} \
            nrel/openstudio:latest

      - name: Run real OpenStudio CLI E2E tests
        env:
          OSIMFLOW_RUN_REAL_OPENSTUDIO: "1"
          OSIMFLOW_OPENSTUDIO_VERSION: ${{ steps.inputs.outputs.openstudio_version }}
        run: |
          .venv/bin/pytest \
            tests/unit/test_run_openstudio_sim.py::TestRealOpenStudioE2E \
            -v --timeout=600 --no-cov -ra

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openstudio-cli-e2e-logs
          path: |
            tests/unit/test_run_openstudio_sim.py
            osimflow/_work_scripts/
          retention-days: 7

  # -------------------------------------------------------------------------
  # NEW (issue #939): full-Campaign real-openstudio.cli E2E over all 7 DAG
  # steps. Skipped in normal PR CI (no openstudio.cli); runs nightly.
  # -------------------------------------------------------------------------
  full-campaign-e2e:
    name: full-Campaign real-CLI E2E (${{ inputs.openstudio_version || vars.OPENSTUDIO_VERSION || '3.11.0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set inputs
        id: inputs
        run: |
          VERSION="${{ inputs.openstudio_version || vars.OPENSTUDIO_VERSION || '3.11.0' }}"
          echo "openstudio_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OSimFlow with dev extras
        run: pip install -e ".[dev]"

      - name: Fetch real OpenStudio example fixture (.osm + .epw)
        # Materialise the real, simulation-capable example_package/ fixture
        # (gitignored) so the campaign has a genuine seed model + weather file.
        run: python3 scripts/fetch_example_fixture.py

      - name: Install OpenStudio CLI from NREL release
        # Install the real openstudio.cli onto the host runner PATH so the
        # campaign's real-CLI path (shutil.which) resolves it. The .deb asset
        # name carries a commit-SHA suffix, so resolve it dynamically via the
        # GitHub release API (prefers Ubuntu 22.04, then 20.04).
        env:
          OS_VERSION: ${{ steps.inputs.outputs.openstudio_version }}
        run: |
          set -euo pipefail
          ASSET_URL="$(
            curl -fsSL "https://api.github.com/repos/NREL/OpenStudio/releases/tags/v${OS_VERSION}" \
              | python3 -c '
                import json, sys
                rel = json.load(sys.stdin)
                urls = [a["browser_download_url"] for a in rel.get("assets", [])]
                debs = [u for u in urls if "Ubuntu" in u and u.endswith(".deb")]
                if not debs:
                    sys.exit("no Ubuntu .deb asset found for this release")
                # Prefer 22.04 then 20.04.
                for pref in ("22.04", "20.04"):
                    for u in debs:
                        if pref in u:
                            print(u)
                            sys.exit(0)
                print(debs[0])
              '
          )"
          echo "Downloading: ${ASSET_URL}"
          curl -fsSL -o /tmp/openstudio.deb "${ASSET_URL}"
          sudo apt-get update
          sudo apt-get install -y /tmp/openstudio.deb
          # Confirm the CLI is resolvable (openstudio and/or openstudio.cli).
          (openstudio --version || openstudio.cli --version) 2>/dev/null \
            || { echo "openstudio CLI not on PATH after install"; exit 1; }

      - name: Run full-Campaign real-CLI E2E test
        env:
          OSIMFLOW_RUN_REAL_OPENSTUDIO: "1"
          OSIMFLOW_OPENSTUDIO_VERSION: ${{ steps.inputs.outputs.openstudio_version }}
        run: |
          .venv/bin/pytest \
            tests/integration/test_real_openstudio_campaign.py \
            -v --timeout=3600 --no-cov -ra

      - name: Upload campaign artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-campaign-e2e-artifacts
          path: |
            tests/integration/test_real_openstudio_campaign.py
            example_package/workflow.osw
          retention-days: 7
