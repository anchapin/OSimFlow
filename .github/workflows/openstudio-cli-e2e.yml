# =============================================================================
# .github/workflows/openstudio-cli-e2e.yml — Real OpenStudio CLI E2E (nightly)
# =============================================================================
# Runs a minimal real OpenStudio simulation campaign against the
# nrel/openstudio:<version> container every night at 06:00 UTC and on
# manual trigger (workflow_dispatch).
#
# This workflow exercises the production code path that was previously
# stub-only: openstudio.cli run -w workflow.osw inside the container,
# eplusout.sql validation, and the --openstudio_version flag across
# multiple version tags (issue #246).
#
# Prerequisites:
#   vars.OPENSTUDIO_VERSION — OpenStudio version to test (e.g. 3.11.0)
#
# Uses the nrel/openstudio container from Docker Hub. No credentials needed.
# =============================================================================
name: openstudio-cli-e2e (Nightly)

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6am UTC
  workflow_dispatch:
    inputs:
      openstudio_version:
        description: 'OpenStudio version (e.g. 3.11.0)'
        required: false
        default: '3.11.0'
      n_samples:
        description: 'Number of samples to run'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  openstudio-cli-e2e:
    name: openstudio-cli-e2e (${{ inputs.openstudio_version || vars.OPENSTUDIO_VERSION || '3.11.0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set inputs
        id: inputs
        run: |
          VERSION="${{ inputs.openstudio_version || vars.OPENSTUDIO_VERSION || '3.11.0' }}"
          SAMPLES="${{ inputs.n_samples || '1' }}"
          echo "openstudio_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "n_samples=${SAMPLES}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OSimFlow with dev extras
        run: pip install -e ".[dev]"

      - name: Pull OpenStudio container
        run: |
          docker pull nrel/openstudio:${{ steps.inputs.outputs.openstudio_version }}
          docker tag nrel/openstudio:${{ steps.inputs.outputs.openstudio_version }} \
            nrel/openstudio:latest

      - name: Run real OpenStudio CLI E2E tests
        env:
          OSIMFLOW_RUN_REAL_OPENSTUDIO: "1"
          OSIMFLOW_OPENSTUDIO_VERSION: ${{ steps.inputs.outputs.openstudio_version }}
        run: |
          .venv/bin/pytest \
            tests/unit/test_run_openstudio_sim.py::TestRealOpenStudioE2E \
            -v --timeout=600 --no-cov -ra

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openstudio-cli-e2e-logs
          path: |
            tests/unit/test_run_openstudio_sim.py
            osimflow/_work_scripts/
          retention-days: 7
