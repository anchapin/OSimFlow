# =============================================================================
# .github/workflows/agents-contract.yml — code/docs drift gate
# =============================================================================
# Runs on PRs. Fails the PR if AGENTS.md or docs/ drift from the code
# without an explicit update.
# =============================================================================
name: agents-contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: agents & docs contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: AGENTS.md / code drift
        run: python tools/check_agents_contract.py

      - name: docs/ path resolution
        run: python tools/check_docs_sync.py

      - name: docs/openapi.json sync (issue #1049)
        run: |
          pip install -e ".[dev,api]" --quiet
          python tools/check_openapi_sync.py --summary
