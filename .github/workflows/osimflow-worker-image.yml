# Builds the AWS Batch worker runtime image and runs its container smoke test
# (issue #1810). Needs Docker Hub access to nrel/openstudio only; no AWS creds.
name: osimflow-worker-image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/osimflow-worker/Dockerfile
          build-args: OPENSTUDIO_VERSION=3.10.0
          tags: osimflow-worker:3.10.0
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run --rm --entrypoint python osimflow-worker:3.10.0 \
            /opt/osimflow/smoke_test.py
      - name: Batch command override
        run: |
          docker run --rm osimflow-worker:3.10.0 \
            python -m osimflow.remote_runner --negotiate-version
