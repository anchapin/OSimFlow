# =============================================================================
# .github/workflows/pbs-e2e.yml — Real PBS / Torque E2E (nightly)
# =============================================================================
# Runs a 3-sample campaign against a real PBS / Torque cluster every night at
# 06:00 UTC and on manual trigger (workflow_dispatch).
#
# IMPORTANT — SELF-HOSTED RUNNER REQUIRED:
#   There is no public PBS cluster reachable from GitHub-hosted runners.
#   ``qsub`` / ``qstat`` are not on PATH for ``ubuntu-latest``, so the
#   test would skip (or fail its structural cluster=="pbs" assertion).
#   To actually exercise the production path:
#
#     1. Register a GitHub Actions self-hosted runner on a PBS / Torque
#        head or login node.
#     2. Tag that runner with both ``self-hosted`` and ``pbs``.
#     3. Set ``vars.OSIMFLOW_PBS_QUEUE`` to a queue the runner's submit
#        user can queue to.
#
#   The job then runs only on manual ``workflow_dispatch`` (no cron) so it
#   never consumes cluster queue time without an explicit operator action.
#
# Prerequisites (GitHub variables):
#   vars.OSIMFLOW_PBS_QUEUE — PBS/Torque queue / destination (required)
#
# The test file uses ``pytest.mark.skipif`` so it is inert in normal CI.
# =============================================================================

name: PBS E2E (Nightly)

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  workflow_dispatch:  # Manual trigger only
    inputs:
      n_samples:
        description: "Number of campaign samples to run (default 3)"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  pbs-e2e:
    uses: ./.github/workflows/substrate-e2e-reusable.yml
    with:
      runs-on: '["self-hosted","pbs"]'
      install-command: pip install -e ".[dev,slurm]"
      setup-script: |
        command -v qsub >/dev/null || { echo "qsub not on PATH — not a PBS head node" >&2; exit 1; }
        command -v qstat >/dev/null || { echo "qstat not on PATH — PBS executor cannot poll" >&2; exit 1; }
        echo "PBS toolchain OK"
      test-path: tests/integration/test_real_pbs_campaign.py
      test-env: |
        OSIMFLOW_PBS_E2E=1
        OSIMFLOW_PBS_QUEUE=${{ vars.OSIMFLOW_PBS_QUEUE }}
