# =============================================================================
# .github/workflows/aws-batch-e2e.yml — Real AWS Batch E2E (nightly)
# =============================================================================
# Runs campaigns against a real AWS Batch compute environment every night at
# 06:00 UTC and on manual trigger (workflow_dispatch).
#
# Two jobs:
#   1. ``aws-batch-e2e``             — the cheaper stub-in-container smoke
#      (issue #146). The work function is the OSimFlow stub; no real
#      openstudio.cli runs. Bounds cost via a 3-sample campaign.
#   2. ``aws-batch-real-openstudio-e2e`` — the real-openstudio-in-container E2E
#      (issue #942). Requires a Batch job definition whose container image is
#      ``nrel/openstudio:<version>`` (or an ECR mirror) so the real
#      ``openstudio.cli`` ships in the image. ``OSIMFLOW_STUB_SIM`` is left
#      unset so the work function invokes the real CLI. Bounded to 2 samples.
#
# Prerequisites (GitHub secrets / variables):
#   secrets.AWS_ROLE_ARN  — scoped IAM role ARN (OIDC) with Batch submit/describe
#                           and S3 result-bucket permissions
#   secrets.OSIMFLOW_TASK_PAYLOAD_SECRET — HMAC secret that signs task payloads;
#                           the Batch job definition's worker must hold the same
#                           value (issue #1177 / #1633)
#   vars.AWS_REGION       — AWS region (e.g. us-east-1)
#   vars.AWS_BATCH_QUEUE  — Batch job queue name
#   vars.AWS_BATCH_RESULT_BUCKET — S3 bucket for staged inputs / results
#   vars.AWS_BATCH_CONTAINER_DIGEST — digest-pinned image (acceptance job only)
#   vars.AWS_BATCH_JOB_DEFINITION        — job def for the stub-in-container job
#   vars.AWS_BATCH_REAL_OS_JOB_DEFINITION — job def whose image is
#                                           nrel/openstudio:<version> (issue #942).
#                                           Falls back to AWS_BATCH_JOB_DEFINITION.
#
# Uses OIDC (aws-actions/configure-aws-credentials) — no long-lived keys.
#
# Unconfigured infrastructure (issue #1813): every job runs
# ``scripts/e2e_gate.py preflight`` BEFORE installing anything. On the nightly
# schedule, missing configuration is reported as "UNAVAILABLE (not verified)"
# in the job summary and the remaining steps are skipped. On workflow_dispatch
# with ``strict`` (default true) missing configuration FAILS the job. A passing
# run additionally requires executed (non-skipped) tests, verified from the
# JUnit report by ``scripts/e2e_gate.py junit``; the JUnit XML and pytest
# basetemp (result artifacts) are uploaded.
# =============================================================================
name: AWS Batch E2E (Nightly)

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6am UTC
  workflow_dispatch: # Manual trigger
    inputs:
      strict:
        description: "Fail (instead of reporting UNAVAILABLE) when AWS configuration is missing"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  aws-batch-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STRICT_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.strict && '--strict' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight — verify AWS configuration
        id: preflight
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          OSIMFLOW_TASK_PAYLOAD_SECRET: ${{ secrets.OSIMFLOW_TASK_PAYLOAD_SECRET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_BATCH_QUEUE: ${{ vars.AWS_BATCH_QUEUE }}
          AWS_BATCH_JOB_DEFINITION: ${{ vars.AWS_BATCH_JOB_DEFINITION }}
          AWS_BATCH_RESULT_BUCKET: ${{ vars.AWS_BATCH_RESULT_BUCKET }}
        run: >
          python3 scripts/e2e_gate.py preflight --label "aws-batch-e2e" $STRICT_FLAG
          --require AWS_ROLE_ARN OSIMFLOW_TASK_PAYLOAD_SECRET AWS_REGION
          AWS_BATCH_QUEUE AWS_BATCH_JOB_DEFINITION AWS_BATCH_RESULT_BUCKET

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.preflight.outputs.available == 'true'
        with:
          python-version: "3.12"

      - name: Create venv and install OSimFlow (dev + aws extras)
        if: steps.preflight.outputs.available == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,aws]"

      - name: Configure AWS credentials (OIDC)
        if: steps.preflight.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run tests
        if: steps.preflight.outputs.available == 'true'
        env:
          OSIMFLOW_AWS_BATCH_E2E: 1
          OSIMFLOW_AWS_BATCH_QUEUE: ${{ vars.AWS_BATCH_QUEUE }}
          OSIMFLOW_AWS_BATCH_JOB_DEFINITION: ${{ vars.AWS_BATCH_JOB_DEFINITION }}
          OSIMFLOW_AWS_BATCH_RESULT_BUCKET: ${{ vars.AWS_BATCH_RESULT_BUCKET }}
          OSIMFLOW_AWS_REGION: ${{ vars.AWS_REGION }}
          OSIMFLOW_TASK_PAYLOAD_SECRET: ${{ secrets.OSIMFLOW_TASK_PAYLOAD_SECRET }}
        run: >
          .venv/bin/pytest tests/integration/test_aws_batch_real.py tests/integration/test_aws_batch_cache_resume.py -v -ra --no-cov --timeout=3600
          --junitxml=e2e-artifacts/aws-batch-e2e-junit.xml
          --basetemp=e2e-artifacts/aws-batch-e2e-results

      - name: Verify tests actually executed (JUnit)
        if: steps.preflight.outputs.available == 'true'
        run: python3 scripts/e2e_gate.py junit --label "aws-batch-e2e" --report e2e-artifacts/aws-batch-e2e-junit.xml

      - name: Upload JUnit + result artifacts
        if: always() && steps.preflight.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aws-batch-e2e-evidence
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14

  aws-batch-real-openstudio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STRICT_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.strict && '--strict' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight — verify AWS configuration
        id: preflight
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          OSIMFLOW_TASK_PAYLOAD_SECRET: ${{ secrets.OSIMFLOW_TASK_PAYLOAD_SECRET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_BATCH_QUEUE: ${{ vars.AWS_BATCH_QUEUE }}
          AWS_BATCH_JOB_DEFINITION: ${{ vars.AWS_BATCH_REAL_OS_JOB_DEFINITION || vars.AWS_BATCH_JOB_DEFINITION }}
          AWS_BATCH_RESULT_BUCKET: ${{ vars.AWS_BATCH_RESULT_BUCKET }}
        run: >
          python3 scripts/e2e_gate.py preflight --label "aws-batch-real-openstudio-e2e" $STRICT_FLAG
          --require AWS_ROLE_ARN OSIMFLOW_TASK_PAYLOAD_SECRET AWS_REGION
          AWS_BATCH_QUEUE AWS_BATCH_JOB_DEFINITION AWS_BATCH_RESULT_BUCKET

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.preflight.outputs.available == 'true'
        with:
          python-version: "3.12"

      - name: Create venv and install OSimFlow (dev + aws extras)
        if: steps.preflight.outputs.available == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,aws]"

      - name: Fetch real OpenStudio fixture (.osm + .epw)
        if: steps.preflight.outputs.available == 'true'
        run: .venv/bin/python scripts/fetch_example_fixture.py

      - name: Configure AWS credentials (OIDC)
        if: steps.preflight.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run tests
        if: steps.preflight.outputs.available == 'true'
        env:
          OSIMFLOW_AWS_BATCH_E2E: 1
          OSIMFLOW_AWS_BATCH_REAL_OPENSTUDIO: 1
          OSIMFLOW_AWS_BATCH_QUEUE: ${{ vars.AWS_BATCH_QUEUE }}
          OSIMFLOW_AWS_BATCH_JOB_DEFINITION: ${{ vars.AWS_BATCH_REAL_OS_JOB_DEFINITION || vars.AWS_BATCH_JOB_DEFINITION }}
          OSIMFLOW_AWS_BATCH_RESULT_BUCKET: ${{ vars.AWS_BATCH_RESULT_BUCKET }}
          OSIMFLOW_AWS_REGION: ${{ vars.AWS_REGION }}
          OSIMFLOW_TASK_PAYLOAD_SECRET: ${{ secrets.OSIMFLOW_TASK_PAYLOAD_SECRET }}
        run: >
          .venv/bin/pytest tests/integration/test_aws_batch_real_openstudio.py -v -ra --no-cov --timeout=3600
          --junitxml=e2e-artifacts/aws-batch-real-openstudio-e2e-junit.xml
          --basetemp=e2e-artifacts/aws-batch-real-openstudio-e2e-results

      - name: Verify tests actually executed (JUnit)
        if: steps.preflight.outputs.available == 'true'
        run: python3 scripts/e2e_gate.py junit --label "aws-batch-real-openstudio-e2e" --report e2e-artifacts/aws-batch-real-openstudio-e2e-junit.xml

      - name: Upload JUnit + result artifacts
        if: always() && steps.preflight.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aws-batch-real-openstudio-e2e-evidence
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14

  aws-batch-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch'
    env:
      STRICT_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.strict && '--strict' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight — verify AWS configuration
        id: preflight
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          OSIMFLOW_TASK_PAYLOAD_SECRET: ${{ secrets.OSIMFLOW_TASK_PAYLOAD_SECRET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_BATCH_QUEUE: ${{ vars.AWS_BATCH_QUEUE }}
          AWS_BATCH_JOB_DEFINITION: ${{ vars.AWS_BATCH_JOB_DEFINITION }}
          AWS_BATCH_RESULT_BUCKET: ${{ vars.AWS_BATCH_RESULT_BUCKET }}
          OSIMFLOW_AWS_BATCH_CONTAINER_DIGEST: ${{ vars.AWS_BATCH_CONTAINER_DIGEST }}
        run: >
          python3 scripts/e2e_gate.py preflight --label "aws-batch-acceptance" $STRICT_FLAG
          --require AWS_ROLE_ARN OSIMFLOW_TASK_PAYLOAD_SECRET AWS_REGION
          AWS_BATCH_QUEUE AWS_BATCH_JOB_DEFINITION AWS_BATCH_RESULT_BUCKET OSIMFLOW_AWS_BATCH_CONTAINER_DIGEST

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.preflight.outputs.available == 'true'
        with:
          python-version: "3.12"

      - name: Create venv and install OSimFlow (dev + aws extras)
        if: steps.preflight.outputs.available == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,aws]"

      - name: Fetch real OpenStudio fixture (.osm + .epw)
        if: steps.preflight.outputs.available == 'true'
        run: .venv/bin/python scripts/fetch_example_fixture.py

      - name: Configure AWS credentials (OIDC)
        if: steps.preflight.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run tests
        if: steps.preflight.outputs.available == 'true'
        env:
          OSIMFLOW_AWS_BATCH_E2E: 1
          OSIMFLOW_AWS_BATCH_ACCEPTANCE: 1
          OSIMFLOW_AWS_BATCH_ACCEPTANCE_STRICT: 1
          OSIMFLOW_AWS_BATCH_CONTAINER_DIGEST: ${{ vars.AWS_BATCH_CONTAINER_DIGEST }}
          OSIMFLOW_AWS_BATCH_ACCEPTANCE_EVIDENCE_DIR: e2e-artifacts/acceptance-evidence
          OSIMFLOW_AWS_BATCH_QUEUE: ${{ vars.AWS_BATCH_QUEUE }}
          OSIMFLOW_AWS_BATCH_JOB_DEFINITION: ${{ vars.AWS_BATCH_JOB_DEFINITION }}
          OSIMFLOW_AWS_BATCH_RESULT_BUCKET: ${{ vars.AWS_BATCH_RESULT_BUCKET }}
          OSIMFLOW_AWS_REGION: ${{ vars.AWS_REGION }}
          OSIMFLOW_TASK_PAYLOAD_SECRET: ${{ secrets.OSIMFLOW_TASK_PAYLOAD_SECRET }}
        run: >
          .venv/bin/pytest tests/integration/test_aws_batch_acceptance.py -v -ra --no-cov --timeout=7200
          --junitxml=e2e-artifacts/aws-batch-acceptance-junit.xml
          --basetemp=e2e-artifacts/aws-batch-acceptance-results

      - name: Verify tests actually executed (JUnit)
        if: steps.preflight.outputs.available == 'true'
        run: python3 scripts/e2e_gate.py junit --label "aws-batch-acceptance" --report e2e-artifacts/aws-batch-acceptance-junit.xml

      - name: Upload JUnit + result artifacts
        if: always() && steps.preflight.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aws-batch-acceptance-evidence
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
