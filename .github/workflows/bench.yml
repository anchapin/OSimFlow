name: bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    name: bench (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,aws,slurm]"

      - name: Run benchmark
        env:
          # CI runners vary in speed; allow the workflow to override
          # the cold-cache wall-clock threshold without editing source.
          OSIMFLOW_BENCH_THRESHOLD_S: "60"
        run: |
          python -m tests.benchmarks.bench_campaign \
            --input_variables variables.yml \
            --template_sim_package ./example_package \
            --outdir ./bench-out \
            --openstudio_version 3.4.0 \
            --n_samples 3

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.python-version }}
          path: bench-out/benchmarks.json
          if-no-files-found: error
