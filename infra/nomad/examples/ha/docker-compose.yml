# docker-compose.yml — 3-server + 2-client Nomad HA cluster (issue #123)
#
# Usage:
#   docker compose up -d
#   ./bootstrap.sh
#
# The server nodes form a Raft quorum (bootstrap_expect=3). Both
# client nodes join the cluster and mount the Docker socket so
# Nomad can dispatch Docker-based task drivers (the same driver
# the NomadExecutor uses for OpenStudio containers).
#
# ACL is enabled on every node. Run bootstrap.sh to generate the
# management token, create agent/worker policies, and register a
# sample job.

version: "3.8"

services:
  nomad-server-1:
    image: hashicorp/nomad:1.7
    command: agent -config=/etc/nomad/server.hcl
    volumes:
      - ./server.hcl:/etc/nomad/server.hcl:ro
      - nomad-server-1-data:/opt/nomad/data
    ports:
      - "4646:4646"   # HTTP API (server-1 is the gateway)
      - "4647:4647"   # RPC
      - "4648:4648"   # Serf
    networks:
      - nomad
    hostname: nomad-server-1

  nomad-server-2:
    image: hashicorp/nomad:1.7
    command: agent -config=/etc/nomad/server2.hcl
    volumes:
      - ./server2.hcl:/etc/nomad/server2.hcl:ro
      - nomad-server-2-data:/opt/nomad/data
    networks:
      - nomad
    hostname: nomad-server-2

  nomad-server-3:
    image: hashicorp/nomad:1.7
    command: agent -config=/etc/nomad/server3.hcl
    volumes:
      - ./server3.hcl:/etc/nomad/server3.hcl:ro
      - nomad-server-3-data:/opt/nomad/data
    networks:
      - nomad
    hostname: nomad-server-3

  nomad-client-1:
    image: hashicorp/nomad:1.7
    command: agent -config=/etc/nomad/client.hcl
    volumes:
      - ./client.hcl:/etc/nomad/client.hcl:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-client-1-data:/opt/nomad/data
    networks:
      - nomad
    depends_on:
      - nomad-server-1
    hostname: nomad-client-1

  nomad-client-2:
    image: hashicorp/nomad:1.7
    command: agent -config=/etc/nomad/client.hcl
    volumes:
      - ./client.hcl:/etc/nomad/client.hcl:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-client-2-data:/opt/nomad/data
    networks:
      - nomad
    depends_on:
      - nomad-server-1
    hostname: nomad-client-2

networks:
  nomad:
    driver: bridge

volumes:
  nomad-server-1-data:
  nomad-server-2-data:
  nomad-server-3-data:
  nomad-client-1-data:
  nomad-client-2-data:
