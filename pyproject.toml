[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osimflow"
version = "0.1.0"
description = "Community-driven parametric OpenStudio simulation campaigns"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "OSimFlow maintainers"},
]
keywords = [
    "openstudio",
    "energyplus",
    "building-energy",
    "parametric",
    "workflow",
    "scientific-campaigns",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "pyyaml>=6",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2",
    "pyarrow>=12",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "openpyxl>=3.1",
    "submitit>=1.5; platform_system != 'Windows'",
    "jsonschema>=4.17",
    "fasteners>=0.19",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
    "pre-commit>=3.7",
    "moto[batch]>=5",
    "streamlit>=1.30",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "schemathesis>=3.19",
    "fakeredis>=2.20",
]
aws = [
    "boto3>=1.28",
]
azure = [
    # Track-2 SDK (issue #1582): AzureBatchExecutor codes against the
    # azure-batch 15.x API surface (BatchClient, models.BatchTaskCreateOptions,
    # ...). <16 keeps the executor's typed call sites stable; the extra is
    # installed by the dev/CI typecheck envs so mypy --strict resolves — and
    # actually checks — osimflow/executors/azure_batch_executor.py.
    "azure-batch>=15.1,<16",
    "azure-identity>=1.12",
]
nomad = []  # stdlib-only HTTP; empty marker for requirements.txt documentation
slurm = [
    "submitit>=1.5",
]
mlflow = [
    "mlflow>=2",
]
sensitivity = [
    "SALib>=1.4",
]
optimization = [
    "pymoo>=0.6",
]
ga = [
    "deap>=1.4",
]
api = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "prometheus_client>=0.19",
]
viz = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
tui = [
    "rich>=13.0",
]
r = [
    "pyarrow>=12",
]
kubernetes = [
    "kubernetes>=29",
]

[project.scripts]
osimflow = "osimflow.__main__:main"

# ---------------------------------------------------------------------------
# Entry-point groups for third-party plug-ins (issue #432)
# ---------------------------------------------------------------------------
# Third-party packages can register custom algorithms or executors by
# declaring entry points in these groups.  Discovery is automatic — the
# AlgorithmRegistry.discover_plugins() and ExecutorRegistry.discover_plugins()
# methods scan these groups at import time.
#
# Example for a third-party ``pyproject.toml``:
#
#   [project.entry-points."osimflow.algorithms"]
#   bayesian_opt = "my_pkg.algorithms:BayesianOptAlgorithm"
#
#   [project.entry-points."osimflow.executors"]
#   k8s_gpu = "my_pkg.executors:K8sGpuExecutor"
#
# The entry-point ``name`` becomes the name used on the CLI
# (--algorithm bayesian_opt / --executor k8s_gpu).  The value must point
# to a BaseAlgorithm or BaseExecutor subclass respectively.
# ---------------------------------------------------------------------------
# The built-in algorithms and executors are registered programmatically
# (not as entry points) so the tables below are intentionally empty.
[project.entry-points."osimflow.algorithms"]
[project.entry-points."osimflow.executors"]

[project.urls]
Homepage = "https://github.com/anchapin/OSimFlow"
Issues = "https://github.com/anchapin/OSimFlow/issues"

[tool.setuptools.packages.find]
include = ["osimflow*"]

[tool.setuptools.package-data]
"osimflow" = ["py.typed"]
"osimflow._work_scripts" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "nomad_e2e: marks tests requiring a Docker-based Nomad cluster",
    "contract: marks contract / README staleness tests",
    "chaos: marks tests that exercise the chaos fault-injection wiring (issue #1013). Run with '-m chaos'; deselected by default in fast-CI.",
    "full: marks tests that recursively execute the entire test suite (test_coverage_gate, issue #1624). Run explicitly with '-m full'; deselected from pre-commit / make test-fast via '-m \"not slow and not chaos and not full\"'.",
]

[tool.coverage.run]
branch = true
source = ["osimflow"]
# Subprocess coverage (issue #1557): `patch = ["subprocess"]` is the
# coverage.py-supported way to enable subprocess measurement. It implicitly
# sets `parallel = true`, which gives every subprocess its own
# `.coverage.<host>.<pid>.<rand>` data file; the parent pytest-cov worker's
# `combine()` step then merges them. The Makefile `test-cov` target sets
# `COVERAGE_PROCESS_START=$(pwd)/pyproject.toml` so subprocesses spawned by
# tests (`bin/*.py` shims → `osimflow._work_scripts.*`) load this same
# config and start coverage automatically via the installed `coverage.pth`.
concurrency = ["multiprocessing", "thread"]
patch = ["subprocess"]
# Omit list (issues #1557 + #1694):
#   * `__main__.py` — 139 KB argparse CLI; tested end-to-end but never
#     imported as a library, so it has no per-module floor.
#   * `algorithms/{fast99,morris,nsga2,pso,ga}.py` — pulled in via
#     optional `[sensitivity]` (SALib) / `[optimization]` (pymoo) /
#     `[ga]` (DEAP) extras; not in the per-module scope.
#   * `viz/dashboard.py` — optional `[viz]` streamlit dashboard.
# `osimflow/api/*` was removed from this list by issue #1694 so the
# per-module floor check in `tools/check_module_coverage.py` can see
# those files; the 82% aggregate gate is preserved because the
# measured api/ coverage (78-100% per file) sits comfortably above
# the gate's 82% floor (aggregate is 88.59% in the seeded measurement).
omit = [
    "osimflow/__main__.py",
    "osimflow/algorithms/fast99.py",
    "osimflow/algorithms/morris.py",
    "osimflow/algorithms/nsga2.py",
    "osimflow/algorithms/pso.py",
    "osimflow/algorithms/ga.py",
    "osimflow/viz/dashboard.py",
]

[tool.coverage.report]
# `report.omit` mirrors `[tool.coverage.run] omit` for the report and
# aggregate (issue #1557 follow-on). Without this, `coverage report`
# 7.16+ includes the omitted files in the denominator at 0%, deflating
# the TOTAL — the gate then tracks "all source files" rather than
# "measured code". The previous 82% gate baseline (85.20% TOTAL on
# commit 30f3c79) was implicitly measured-only; this key preserves
# that semantic after subprocess coverage is enabled. Issue #1694
# removed `osimflow/api/*` from this list for the same reason it was
# removed from `[tool.coverage.run] omit` above.
omit = [
    "osimflow/__main__.py",
    "osimflow/algorithms/fast99.py",
    "osimflow/algorithms/morris.py",
    "osimflow/algorithms/nsga2.py",
    "osimflow/algorithms/pso.py",
    "osimflow/algorithms/ga.py",
    "osimflow/viz/dashboard.py",
]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter; replaces flake8+isort+pyupgrade+flake8-bugbear)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["osimflow", "bin", "user_scripts", "tests"]
extend-exclude = [
    ".agents/skills",
    "worktrees",
    # ruff >= 0.16 formats Python code blocks embedded in Markdown docs.
    # Docs code samples are illustrative (often intentionally elided) —
    # keep them out of the formatter to avoid docs churn on tool bumps.
    "*.md",
    "*.mdx",
    # BYOS inline runner — generated by tools/_generate_byos_runner.py
    # from osimflow.byos_contract._BYOS_CONTRACT (issue #1061).  The
    # generator embeds the contract as a literal pprint dict; reformatting
    # it would re-introduce the drift risk the generator exists to prevent.
    "osimflow/_byos_runner_generated.py",
]

[tool.ruff.lint]
# E/W: pycodestyle; F: pyflakes; I: isort; UP: pyupgrade;
# B: flake8-bugbear; SIM: simplify; PL: pylint.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PL", "BLE", "S110", "T20", "PGH003"]
# B008: function call in default argument (used by Pydantic-style contracts).
# PLR0913: too many arguments (Campaign.__init__ legitimately has many).
# PLR2004: magic value (energy-modeling domain has many "magic" constants).
# PLR0915: too many statements (auto-recovery block in _submit_and_await_all).
# PLR0917: too many positional arguments (same public-API surface as PLR0913;
# executor submit()/work-layer signatures legitimately exceed 5 positional args;
# stabilized in ruff 0.16 and now enforced by the unpinned CI linter).
ignore = ["B008", "PLR0913", "PLR2004", "E501", "PLR0915", "PLR0917"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# bin/*.py are CLI scripts (argparse, top-level side effects OK).
"bin/*" = ["PL", "SIM", "BLE", "S110", "T20"]
# scripts/*.py are CLI utility scripts that use lazy imports to avoid
# paying import cost when the optional dependency (bson/pymongo) is absent.
"scripts/*" = ["PL", "SIM", "PLC0415", "BLE", "S110", "T20"]
# _work_scripts/ are CLI scripts (same as bin/).
"osimflow/_work_scripts/*" = ["PL", "SIM", "T20"]
# tests/ use pytest patterns that ruff would otherwise flag.
"tests/**" = ["PL", "SIM", "B011", "F841", "BLE", "S110", "T20"]
# __init__.py: re-exports.
"**/__init__.py" = ["F401"]
# Executors use lazy SDK imports inside __init__ to avoid paying import
# cost when the local/slurm path is used (AWSBatchExecutor precedent).
"osimflow/executors/*.py" = ["PLC0415"]
# base.py defines shared primitives; import order here is intentional to
# avoid circular deps (azure/google_batch_executor import from base).
"osimflow/executors/__init__.py" = ["I001"]
# campaign.py: SIM108 if-else block is more readable with explanatory comment.
"osimflow/campaign.py" = ["SIM108", "BLE001", "T201"]
# document_store.py: the rich MongoDB-style query semantics
# (``_document_matches`` / ``update_one``) require one branch per
# operator and many return statements; refactoring to dispatch tables
# would obscure the per-operator semantics that the SQLite and Redis
# backends must agree on (issue #1014).
"osimflow/document_store.py" = ["PLR0911", "PLR0912", "BLE001", "S110"]
"osimflow/_document_store_base.py" = ["PLR0911", "PLR0912", "BLE001", "S110"]
"osimflow/_document_store_sqlite.py" = ["PLR0911", "PLR0912", "BLE001", "S110"]
# campaigns.py uses lazy imports for heavy SDKs to avoid import-time overhead.
# PLR0912: too many branches in _build_executor_from_request is intentional
#          to map all executor types to their config dicts.
"osimflow/api/campaigns.py" = ["PLC0415", "I001", "PLR0912"]

# --- Quality ratchets (issue #1892, AGENTS.md §6) -------------------------
# BLE001/S110 (blind/swallowed except), T20 (print) and PGH003 (blanket
# type: ignore) are enforced for osimflow/.  Existing violations are
# baselined per file below; the baseline may only SHRINK -- never add a
# file or rule here, fix the code (log with exc_info=True and re-raise,
# use logging, give ignores an error code).  CLI surfaces legitimately
# print; non-library trees are out of scope for these rules.
"osimflow/__main__.py" = ["T20", "BLE001", "S110"]
"tools/*" = ["BLE", "S110", "T20"]
"user_scripts/**" = ["BLE", "S110", "T20"]
"examples/**" = ["BLE", "S110", "T20"]
"docker/**" = ["BLE", "S110", "T20"]
".agents/**" = ["BLE", "S110", "T20"]

"osimflow/_campaign_artifacts.py" = ["BLE001"]
"osimflow/_campaign_cost_tracker.py" = ["BLE001"]
"osimflow/_campaign_optimization.py" = ["BLE001"]
"osimflow/_work_scripts/aggregate_results.py" = ["BLE001"]
"osimflow/_work_scripts/excel_to_variables.py" = ["BLE001"]
"osimflow/_work_scripts/generate_plots.py" = ["BLE001"]
"osimflow/notifications/alerting.py" = ["BLE001"]
"osimflow/algorithms/calibration.py" = ["BLE001"]
"osimflow/algorithms/da.py" = ["BLE001"]
"osimflow/algorithms/de.py" = ["BLE001"]
"osimflow/algorithms/doe_analysis.py" = ["BLE001"]
"osimflow/algorithms/nsga2.py" = ["BLE001"]
"osimflow/algorithms/rgenoud.py" = ["BLE001"]
"osimflow/algorithms/spea2.py" = ["BLE001"]
"osimflow/api/app.py" = ["BLE001"]
"osimflow/api/coordinator.py" = ["BLE001"]
"osimflow/api/results_viewer.py" = ["BLE001"]
"osimflow/api/variables.py" = ["BLE001"]
"osimflow/audit.py" = ["BLE001"]
"osimflow/batches.py" = ["T201"]
"osimflow/client.py" = ["BLE001"]
"osimflow/config.py" = ["BLE001"]
"osimflow/cross_run_aggregator.py" = ["S110"]
"osimflow/distributed_cache.py" = ["BLE001"]
"osimflow/distributed_jobqueue.py" = ["BLE001"]
"osimflow/executors/aws_batch_executor.py" = ["BLE001"]
"osimflow/executors/dask_jobqueue_executor.py" = ["BLE001"]
"osimflow/executors/docker_swarm_executor.py" = ["BLE001"]
"osimflow/executors/kubernetes_executor.py" = ["BLE001"]
"osimflow/executors/nomad_executor.py" = ["BLE001"]
"osimflow/exporters/osa.py" = ["BLE001"]
"osimflow/exporters/r_dataframe.py" = ["BLE001"]
"osimflow/health.py" = ["BLE001"]
"osimflow/logging.py" = ["BLE001"]
"osimflow/monitoring.py" = ["BLE001"]
"osimflow/remote_runner.py" = ["T201"]
"osimflow/results_db.py" = ["BLE001", "S110"]
"osimflow/results_query.py" = ["T201"]
"osimflow/storage.py" = ["BLE001"]
"osimflow/taskqueue.py" = ["BLE001"]
"osimflow/testing/executor_conformance.py" = ["S110"]
"osimflow/viz/dashboard.py" = ["T201"]
"osimflow/webhook.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["osimflow"]

# ---------------------------------------------------------------------------
# mypy --strict on the public API surface (osimflow/). bin/ and
# user_scripts/ are user-supplied CLI scripts and get a relaxed config.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
enable_error_code = ["ignore-without-code"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
ignore_missing_imports = true
exclude = [
    "bin/",
    "osimflow/_work_scripts/",
    "user_scripts/",
    "tests/",
    "tools/",
    ".venv/",
    ".agents/",
]

[[tool.mypy.overrides]]
module = "osimflow.api.app"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "osimflow.api.events"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "osimflow.api.schemas"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "osimflow.api.campaigns"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.pat_compat"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.files"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.timeseries"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.measures"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.variables"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.ui"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.variable_designer"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.results_viewer"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.variable_designer"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.results_query"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.coordinator"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "osimflow.api.dashboard"
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "tools.*"
disallow_untyped_defs = false
