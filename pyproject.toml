[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osimflow"
version = "0.1.0-dev"
description = "Community-driven parametric OpenStudio simulation campaigns"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "OSimFlow maintainers"},
]
keywords = [
    "openstudio",
    "energyplus",
    "building-energy",
    "parametric",
    "workflow",
    "scientific-campaigns",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "pyyaml>=6",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2",
    "pyarrow>=12",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "submitit>=1.5; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "moto[batch]>=5",
    "streamlit>=1.30",
]
aws = [
    "boto3>=1.28",
]
nomad = []  # stdlib-only HTTP; empty marker for requirements.txt documentation
slurm = [
    "submitit>=1.5",
]
mlflow = [
    "mlflow>=2",
]
sensitivity = [
    "SALib>=1.4",
]
optimization = [
    "pymoo>=0.6",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
]
viz = [
    "streamlit>=1.30",
]

[project.scripts]
osimflow = "osimflow.__main__:main"

[project.urls]
Homepage = "https://github.com/anchapin/OSimFlow"
Issues = "https://github.com/anchapin/OSimFlow/issues"

[tool.setuptools]
packages = ["osimflow", "osimflow.executors", "osimflow.api", "osimflow.viz"]

[tool.setuptools.package-data]
osimflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=osimflow",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "nomad_e2e: marks tests requiring a Docker-based Nomad cluster",
]

[tool.coverage.run]
branch = true
source = ["osimflow"]
omit = [
    "osimflow/__main__.py",
    "osimflow/algorithms/fast99.py",
    "osimflow/algorithms/morris.py",
    "osimflow/algorithms/nsga2.py",
    "osimflow/algorithms/pso.py",
    "osimflow/api/*",
    "osimflow/viz/dashboard.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter; replaces flake8+isort+pyupgrade+flake8-bugbear)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["osimflow", "bin", "user_scripts", "tests"]
# Spike/ directory holds one-off scripts from the workflow-framework decision
# spike. They are not shipped; lint them separately or not at all.
extend-exclude = [".agents/spike"]

[tool.ruff.lint]
# E/W: pycodestyle; F: pyflakes; I: isort; UP: pyupgrade;
# B: flake8-bugbear; SIM: simplify; PL: pylint.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PL"]
# B008: function call in default argument (used by Pydantic-style contracts).
# PLR0913: too many arguments (Campaign.__init__ legitimately has many).
# PLR2004: magic value (energy-modeling domain has many "magic" constants).
ignore = ["B008", "PLR0913", "PLR2004", "E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# bin/*.py are CLI scripts (argparse, top-level side effects OK).
"bin/*" = ["PL", "SIM"]
# tests/ use pytest patterns that ruff would otherwise flag.
"tests/**" = ["PL", "SIM", "B011"]
# __init__.py: re-exports.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["osimflow"]

# ---------------------------------------------------------------------------
# mypy --strict on the public API surface (osimflow/). bin/ and
# user_scripts/ are user-supplied CLI scripts and get a relaxed config.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
ignore_missing_imports = true
exclude = [
    "bin/",
    "user_scripts/",
    "tests/",
    "tools/",
    ".venv/",
    ".agents/",
]

[[tool.mypy.overrides]]
module = "osimflow.api.app"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "osimflow.api.events"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "tools.*"
disallow_untyped_defs = false
