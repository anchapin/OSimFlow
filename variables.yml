# variables.yml — example schema for the OSimFlow LHS sampler.
# See docs/OSimFlow.md §1.4 (Pre-flight Parameter Applicability Validation).
#
# Supported distributions and their parameters:
#   uniform      — min, max
#   lognormal    — mean (of underlying normal), sigma
#   normal       — mean, sigma
#   triangular   — min, max, mode (optional; defaults to symmetric)
#   beta         — alpha, beta, loc (default 0), scale (default 1)
#   gamma        — alpha, loc (default 0), scale (default 1)
#   exponential  — rate (1/lambda)
variables:
  - name: window_u_value
    distribution: uniform
    min: 1.0
    max: 5.0
  - name: infiltration_rate
    distribution: lognormal
    mean: 0.5
    sigma: 0.2
  - name: hvac_setpoint
    distribution: normal
    mean: 22.0
    sigma: 1.0
  - name: lighting_power_density
    distribution: triangular
    min: 5.0
    max: 15.0
    mode: 10.0
  - name: thermal_conductivity
    distribution: beta
    alpha: 2.0
    beta: 5.0
    loc: 0.1
    scale: 2.0
  - name: internal_gain
    distribution: gamma
    alpha: 2.0
    loc: 0.0
    scale: 5.0
  - name: equipment_lifetime
    distribution: exponential
    rate: 10.0
