# Multi-distribution parametric sampling example for example_package/.
# Every variable maps to a real argument of a measure in
# example_package/workflow.osw (SetThermostatSchedule, SetEnvelopePerformance).
# Distributions shown: normal, triangular, discrete, uniform. A `categorical`
# variable works the same way for String/Choice measure arguments, e.g.:
#   - name: roof_type
#     distribution: categorical
#     values: [metal, membrane]
#     measure_argument: <Measure>.<choice_argument>
algorithm: lhs
variables:
  - name: heating_setpoint
    distribution: normal
    mean: 20.0
    sigma: 1.0
    measure_argument: SetThermostatSchedule.heating_setpoint
  - name: cooling_setpoint
    distribution: triangular
    min: 24.0
    max: 28.0
    mode: 26.0
    measure_argument: SetThermostatSchedule.cooling_setpoint
  - name: wall_r_value
    distribution: discrete
    values: [2.0, 3.0, 4.0, 5.0]
    measure_argument: SetEnvelopePerformance.wall_r_value
  - name: wwr
    distribution: uniform
    min: 0.2
    max: 0.6
    measure_argument: SetEnvelopePerformance.wwr
