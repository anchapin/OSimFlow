[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osimflow-client"
version = "0.1.0"
description = "Minimal Python client SDK for OSimFlow REST API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "OSimFlow maintainers"},
]
keywords = [
    "openstudio",
    "building-energy",
    "api-client",
    "rest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/anchapin/OSimFlow"
Issues = "https://github.com/anchapin/OSimFlow/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["osimflow_client*"]

[tool.setuptools.package-data]
"osimflow_client" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["osimflow_client", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["B008", "PLR0913", "PLR2004", "E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PL", "SIM", "B011"]
"osimflow_client/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["osimflow_client"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
