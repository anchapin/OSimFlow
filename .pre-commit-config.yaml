# =============================================================================
# .pre-commit-config.yaml — OSimFlow developer best-practices gate
# =============================================================================
# Local hooks run `make` targets. CI mirrors the same checks in
# .github/workflows/{ci,lint,docs,agents-contract}.yml.
#
# Install:
#   pip install pre-commit && pre-commit install
# Run on demand (mirrors what CI does):
#   pre-commit run --all-files
#
# See docs/DEVELOPMENT.md for the day-to-day workflow.
# =============================================================================
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
        # Spike artifacts are out of scope for the project.
        exclude: ^\.agents/spike/
      - id: trailing-whitespace
        # Markdown line breaks in poetry quotes are meaningful; only strip in code.
        types: [python, yaml, toml]
        exclude: ^\.agents/spike/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        # ruff format replaces black for daily formatting. It produces
        # output that black would also produce modulo line-continuation
        # choices; we standardize on ruff format because it's faster and
        # shares config with the linter.

  - repo: local
    hooks:
      - id: mypy-osimflow
        name: mypy --strict (osimflow/)
        entry: .venv/bin/mypy osimflow
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^\.agents/spike/

      - id: pytest-fast
        name: pytest (contract, fast subset)
        entry: .venv/bin/pytest -o addopts="" tests/contract -x -q -m "not slow and not chaos and not full"
        language: system
        types: [python]
        pass_filenames: false
        # Slow / chaos / full tests stay out of pre-commit (issue #1624):
        # test_coverage_gate (@pytest.mark.full) recursively runs the whole
        # integration+unit suite under coverage and stalled this hook >10 min.
        # The 82% coverage gate is enforced by `make test-cov` / the CI
        # `test` job, not here. Keep this entry identical to the Makefile
        # `test-fast` target (AGENTS.md §2 documents it as the mirror).

      - id: agents-contract
        name: AGENTS.md / code drift contract
        entry: .venv/bin/python tools/check_agents_contract.py
        language: system
        pass_filenames: false

      - id: docs-sync
        name: docs/ path resolution
        entry: .venv/bin/python tools/check_docs_sync.py
        language: system
        pass_filenames: false

      - id: api-doc-coverage
        name: docs/api.md covers every docs/openapi.json path (issue #1677)
        entry: .venv/bin/python tools/check_api_doc_coverage.py
        language: system
        pass_filenames: false

      - id: byos-generate
        name: BYOS runner generator (issue #1061)
        entry: .venv/bin/python tools/_generate_byos_runner.py
        language: system
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Secret scan — guards against accidentally committing .epw,
        # eplusout.*, or AWS keys per AGENTS.md §10.
