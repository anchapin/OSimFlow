# variables.yml — the spike's test fixture.
# Mirrors the schema documented in bin/generate_lhs.py:21-26.
variables:
  - name: window_u_value
    distribution: uniform
    min: 1.0
    max: 5.0
  - name: infiltration_rate
    distribution: lognormal
    mean: 0.5
    sigma: 0.2
  - name: hvac_setpoint
    distribution: uniform
    min: 20.0
    max: 24.0
